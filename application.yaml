#########################################################################################################################
#
#   Main SCCS (Spring Cloud Config Server ) application file used to configure all sccs related configurations
#
#
# Section: modelop:
#     variables in this section
#     gateway-url:                                              Internal entry point into MOC. should be left as http://gateway:8090
#     ws-gateway-url:                                           Internal MOC websocket url for realtime webpage updates default should be ws://gateway:8090
#     moc-center-url:                                           External Ingress backed Url for MOC. Your ingress should configure routes too gateway:8090. e.g. https://modelop-instance.dev.CompanyDomain.com
#     eureka-url:                                               The internal k8 service to the MOC eureka registry service. Should be left as the default http://registry:8761
#     mongodb-url:                                              The fully qualified MongoDB or DocumentDB connection string with port. e.g.
#                                                               mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@my-db-instance.cluster-78tyhgsss.us-east-1.docdb.amazonaws.com:27017/MYDATABASE?ssl=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false
#                                                               * Note: If a certificate is required to establish a secure connection to your backend database make sure to convert the .pem file to a .crt file like so:
#                                                               openssl x509 -outform der -in rds-ca-2019-us-east-2.pem -out rds-ca-2019-us-east-2.crt
#                                                               This certificate file should then be placed in the certs directory of the helm chart and helm will install it for you!
#     zipkin-url:                                               The zipkin internal url. Should be left as the default value of http://zipkin:9411/
#     jenkins-url:                                              Your companies official jenkins url instance that MOC will connect too. Can be left as the default if no jenkins connection is required.
#     jenkins-user:                                             The Jenkins username, Jenkins-password: Password
#     jira-url:                                                 This should be the external name of Jira
#     jira-user:                                                Jira username default is: demo
#     jira-password: <valeur>
#     service-now-url:
#     service-now-user:
#     service-now-password:
#     zammad-url:
#     zammad-user:
#     zammad-password:
#     zammad-token:
#     jupyter-url-base: jupyter:8888
#     r-studio-url: http://rstudio:8787
#     postgres-url:                                             The SQL connection string. We support H2, MySQL, postgres, Oracle, DB2, MSQL, MariaDB Databases. e.g. jdbc:postgresql://postgres:5432/camunda
#     postgres-user:                                            The postgres username defaults too: postgres
#     postgres-password: <valeur>
#     dynatrace-url:
#     dynatrace-token:
#     gitlab-url:                                               Your gitlab url
#     gitlab-user:                                              The gitlab  username. If an access token is used then no user is required.
#     gitlab-password:                                          The gitlab password or access token
#     mlc-output-asset-base-url                                 The base blob store url. For AWS: https://BUCKET_NAME.s3.REGION.amazonaws.com/ , for Azure  https://<storage-account-name>.blob.core.windows.net/<container-name>/,for GCP https://storage.googleapis.com/
#
#     *This configuration supports k8 secrets in replacement for clear text credentials. You would first create your secret then reference the secret via a ENV variable.
#     For more information please go to:
#     https://modelopdocs.atlassian.net/wiki/spaces/dv30/pages/1706688513/ModelOp+Center+Installation
#
######################################################################################################################
modelop:
  gateway-url: http://gateway:8090
  ws-gateway-url: ws://gateway:8090
  moc-center-url: ${modelop.gateway-url} # this should be the external name of MOC
  eureka-url: http://registry:8761
  mongodb-uri: mongodb://admin:${MOC_MONGODB_PASSWORD}@mongodb:27017/modelop?authSource=admin
  zipkin-url: http://zipkin:9411/
  jenkins-url: http://jenkins:8089
  jenkins-user: modelop
  jenkins-password: ${MOC_JENKINS_PASSWORD:}
  jira-url: http://jira:8086 # this should be the external name of Jira
  jira-user: demo
  jira-password: ${MOC_JIRA_PASSWORD:}
  service-now-url:
  service-now-user:
  service-now-password:
  zammad-url:
  zammad-user:
  zammad-password:
  zammad-token:
  jupyter-url-base: jupyter:8888
  r-studio-url: http://rstudio:8787
  postgres-url: jdbc:postgresql://postgres:5432/camunda?currentSchema=public
  postgres-user: postgres
  postgres-password: ${MOC_POSTGRES_PASSWORD}
  dynatrace-url:
  dynatrace-token:
  gitlab-url:
  gitlab-user: # user is not required if using an access token
  gitlab-password:
  mlc-output-asset-base-url:                          #url of blob store for MLC's
  use-case-stages: # Default setup for OOTB MLCS, sets use case and model stages on the ui and in model-manager
    stages:
      - Unmanaged
      - Onboarding
      - Development
      - Reviews
      - Validated
      - Testing
      - Production
      - Retired
  model-stages:
    stages:
      - Unmanaged
      - Validation
      - Production
      - Retired
    production-stage: Production

###################################################################
#
#   Section: management
#   Defaults are fine
#
####################################################################
management:
  endpoints:
    web:
      exposure:
        include: "*"


###################################################################
#
#   Section: logging
#   Specify the logging level for all of the services here.
#   Valid enties are INFO, WARN, DEBUG
#
####################################################################
logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.web.HttpLogging: WARN
    org.springframework.security: WARN
    org.springframework.security.oauth2: WARN
    org.springframework.cloud.gateway: WARN
    # This class logs every OptimisticLockingFailureException which makes the logs extremely noisy
    #  these exceptions are expected and the class does not log other useful information
    org.springframework.data.rest.webmvc.RepositoryRestExceptionHandler: OFF


#####################################################################
##  Default server settings
#####################################################################
server:
  #Allows services to receive larger headers, useful when tokens are large or when users belong to hundreds of groups
  max-http-header-size: 20KB
  error:
    include-message: always
    include-binding-errors: always
spring:
  jackson:
    default-property-inclusion: non_absent
    serialization:
      FAIL_ON_EMPTY_BEANS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
eureka:
  instance:
    # hostname: ${spring.cloud.client.hostname}
    instanceId: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${server.port}}
    non-secure-port-enabled: true
    non-secure-port: ${server.port}
    status-page-url: http://${eureka.instance.hostname}:${server.port}/actuator/info
    health-check-url: http://${eureka.instance.hostname}:${server.port}/actuator/health
    home-page-url: http://${eureka.instance.hostname}:${server.port}
    intial-status: starting
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${modelop.eureka-url}/eureka/
modelManageAPI:
  url: ${modelop.gateway-url}
  name: model-manage
modelManageAPIv2:
  url: ${modelop.gateway-url}/model-manage/api
  name: model-managev2
engineAPI:
  url: ${modelop.gateway-url}
  name:
engineV2API:
  url: ${modelop.gateway-url}
  name:
metricsServiceAPI:
  url: ${modelop.gateway-url}/metrics-service
  name: metrics-service
agentServiceAPI:
  url: ${modelop.gateway-url}/agent-service
reporting-service:
  websocket:
    url: ${modelop.ws-gateway-url}/reporting-service/messages
    max-age: 600000
camundaAPI:
  url: ${modelop.gateway-url}/mlc-service/rest
documentServiceAPI:
  url: ${modelop.gateway-url}/document-service

#####################################################################
##  model-manage bucketInfoList setting options
#####################################################################
model-manage:
  buckets:
    bucketInfoList:
      # Default storage type matching all groups for which there is no storage type configured
      - group:
        bucket: modelop
        path:
        storageType: S3_REPOSITORY

#####################################################################
##  # Configuration properties for the ticketing system(s) used Jira, SewrviceNow or Internal
#####################################################################
ticketing-systems:
  enabled:
    Jira:
      due-date-field: "assignment.jiraIssueObject.Due Date"
      priority-field: "assignment.jiraIssueObject.Priority"
      priority-mappings:
        Critical:
          - "Highest"
        High:
          - "High"
        Medium:
          - "Medium"
        Low:
          - "Low"
        Lowest:
          - "Lowest"
    ServiceNow:
      due-date-field: "assignment.serviceNowIssueObject.Due Date"
      priority-field: "assignment.serviceNowIssueObject.Priority"
      priority-mappings:
        Critical:
          - "1 - Critical"
        High:
          - "2 - High"
        Medium:
          - "3 - Moderate"
        Low:
          - "4 - Low"
        Lowest:
          - "5 - Planning"
    Internal:
      due-date-field: "assignment.dueDate"
      priority-field: "assignment.priority"
      priority-mappings:
        Critical:
          - "Critical"
        High:
          - "High"
        Medium:
          - "Medium"
        Low:
          - "Low"
        Lowest:
          - "Lowest"

