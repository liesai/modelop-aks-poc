#   ModelOp Center integrates with Oauth2 to enable enterprise-grade authentication and access control
#   Here you specify the SSO Adapter oath2 configurations.
#   * To enable ssoadapter the jwt and ssoadapter profiles should be added in your starter file for all of the core services for profile:
#   e.g. profile: ...,ssoadapter,secured,jwt,...
#
#   modelop:
#     ssoadapter-url:
#     ssoadapter-internal-client-id: internal-client
#     ssoadapter-internal-client-secret: <valeur>
#     ssoadapter-external-client-id: external-integration-client
#     ssoadapter-cli-client-id: go-cli
#     ssoadapter-cli-client-secret: <valeur>
#     ssoadapter-gateway-client-id: gateway-service
#     ssoadapter-gateway-client-secret: <valeur>
#
#
#  *Note in addition to configuring the above the following would also need to be present in your starter.yaml file
#  commonRuntimeEnv:
#    modelop.runtime.client-secret: <ssoadapter-internal-client-secret>
#    modelop.runtime.client-id:  <ssoadapter-internal-client-id>
#
#######################################################################################################
spring:
  config:
    activate:
      on-profile: "ssoadapter"

modelop:
  ssoadapter-url:
  ssoadapter-internal-client-id: internal-client
  ssoadapter-internal-client-secret:
  ssoadapter-external-client-id: external-integration-client
  ssoadapter-cli-client-id: go-cli
  ssoadapter-cli-client-secret:
  ssoadapter-gateway-client-id: gateway-service
  ssoadapter-gateway-client-secret:
  provider:
    scope-claimname: scope
    user-name-attribute: sub
    enduser-claimname: uid
    oauth2client-claimname: cid

  idp:
    metadata-uri:
    on-successful-logout-redirect-to: ${modelop.moc-center-url}/logoutModelOp
    saml:
      required-attribute-names:
        groups-attribute: groups
        given-name-attribute: uid
        created-by-attribute: givenName
        user-id-attribute: uid

oauth2:
  group-base-access:
    oauth2-group-claim-name: memberOf
    admin-default-access-group: admin
    items-list: false
    default-access-groups:
    ootb-monitors-group: ALL
