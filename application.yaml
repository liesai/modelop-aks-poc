#######################################################################################################
##
#   ModelOp Center integrates with Oauth2 to enable enterprise-grade authentication and access control
#   PingFederate OATH2 Section
#   These values can be obtained from your PingFederate admin console once those clients are created.
#   * To enable pingfederate the jwt and pingfederate profiles should be added in your starter file for all of the core services for profile:
#   e.g. profile: ...,pingfederate,secured,jwt,...
#
#
#  modelop:
#    pingfederate-url: https://my.pingfederate.comapany.com
#    pingfederate-internal-client-id: internal-client
#    pingfederate-internal-client-secret: <valeur>
#    pingfederate-external-client-id: external-integration-client
#    pingfederate-cli-client-id: go-cli
#    pingfederate-cli-client-secret: <valeur>
#    pingfederate-gateway-client-id: gateway-service
#    pingfederate-gateway-client-secret: <valeur>
#
#
#  *Note in addition to configuring the above the following would also need to be present in your starter.yaml file
#  commonRuntimeEnv:
#    modelop.runtime.client-secret: <pingfederate-internal-client-secret>
#    modelop.runtime.client-id:  <pingfederate-internal-client-id>
#
#######################################################################################################
spring:
  config:
    activate:
      on-profile: "pingfederate"

modelop:
  pingfederate-url:
  pingfederate-internal-client-id:
  pingfederate-internal-client-secret:
  pingfederate-external-client-id:
  pingfederate-cli-client-id:
  pingfederate-cli-client-secret:
  pingfederate-gateway-client-id:
  pingfederate-gateway-client-secret:
  provider:
    scope-claimname: scope
    user-name-attribute: sub
    enduser-claimname: Username
    oauth2client-claimname: client_id

oauth2:
  group-base-access:
    oauth2-group-claim-name: memberOf
    admin-default-access-group: admin
    items-list: false
    default-access-groups: modelop
    ootb-monitors-group: ALL

---
