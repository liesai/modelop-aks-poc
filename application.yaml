######################################################################
##
#   Enterprise Bucket Storage connection configuration section
#
#   Currently ModelOp Center supports both AWS S3 and Azure Blob Storage, as well as any S3-compliant bucket storage solution, such as MinIO.
#   Configuring example for minio as the default bucket solution. p.s. in addition the minio-s3-client profile will need to be added as one of the profiles in your
#   starter.yaml file for modelManager and mlcManager
#   s3:
#     s3-host: mino
#     s3-accessKey: <valeur>
#     s3-secretKey: <valeur>
#     s3-port: 9000
#     s3-secure: false
#     s3-defaultBucket: modelop
#     s3-region: default-region
#
#
#
#   Setting example for AWS s3 as the Default Bucket solution. For AWS s3 ModelOp Center supports username/password, accessKey/secretKey and Role based authentication mechanisms.
#   p.s. in addition the aws-s3-client profile will need to be added as one of the profiles in your starter.yaml file for modelManager and mlcManager
#   s3:
#     s3-host:
#     s3-accessKey: <valeur>
#     s3-secretKey: <valeur>
#     s3-port: 443
#     s3-secure: true
#     s3-defaultBucket: aws_bucket_name
#     s3-region: aws_default-region
#     server-side-encryption:                                                 # If server side encryption at rest is enabled add these 2 lines
#       encryption:  'aws:kms'
#   s3-credentials:                                                           # If authenticating with accesskey and secrets then add the storedCredentials: section else
#      storedCredentials:                                                     # if Role based authentication then add the section eksServiceAccountCredentials:
#          -path:
#              accessKeyId: <valeur>
#              secretAccessKey: <valeur>
#              authenticationType: BASIC
#      eksServiceAccountCredentials:
#          -path:
#          roleArn: ${AWS_ROLE_ARN}                                           # If a serviceaccountName is present under modelMange in your starter.yaml file then AWS should create this ENV variable for you.
#          webIdentityTokenFile: ${AWS_WEB_IDENTITY_TOKEN_FILE}               # If a serviceaccountName is present under modelMange in your starter.yaml file then AWS should create this ENV variable for you.
#          authenticationType: ASSUME_ROLE_WITH_WEB_IDENTITY                  # The authentication type that model-manage will use to authenticate for s3 bucket permissions. Should be left as ASSUME_ROLE_WITH_WEB_IDENTITY
#
#
#   Setting example for Azure Blob Storage as the Default Bucket Solution. In addition one would also need to update the bucketInfoList in the model-manage.yaml file
#
#   external-file-repo-config:
#     azure:
#       azure-defaultStorageAccountName: <AZURE_STORAGE_ACCOUNT>
#       azure-defaultStorageAccountKey: <valeur>
#       azure-defaultBucket: modelop
#     azure-credentials:
#       storedCredentials:
#         - storageAccountName: <AZURE_STORAGE_ACCOUNT>
#           storageAccountKey: <valeur>
#           path:
#
#
#    P.S. The following edits would also need to be made in the model-manage.yaml file for Azure
#    buckets:
#      bucketInfoList:
#        - group: ALL                                                       # The access group that this bucket location will be associated with. Defaults to the ALL group
#          bucket: <AZURE_BUCKET_NAME>                                      # Enter in the azure Storage container name here
#          path:
#          storageType: AZURE_REPOSITORY                                    # The storage type to use leave as AZURE_REPOSITORY
#
#######################################################################
spring:
  config:
    activate:
      on-profile: "external_file_repo_config"

external-file-repo-config:
  s3:
    s3-host: minio
    s3-accessKey: ${MOC_S3_ACCESS_KEY}
    s3-secretKey: ${MOC_S3_SECRET_KEY}
    s3-port: 9000
    s3-secure: false
    s3-defaultBucket: modelop
    s3-region: default-region
  azure:
    azure-defaultStorageAccountName: DEFAULT_STORAGE_ACCOUNTNAME
    azure-defaultStorageAccountKey: DEFAULT_STORAGE_ACCOUNT_KEY
    azure-defaultBucket: DEFAULT_BUCKET
  azure-credentials:
    storedCredentials:
      - storageAccountName: DEFAULT_STORAGE_ACCOUNTNAME
        storageAccountKey: DEFAULT_STORAGE_ACCOUNT_KEY
        authenticationType: SHARED_KEY
        path:

